name: ci
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: newsai_verify
          MYSQL_USER: newsai
          MYSQL_PASSWORD: newsai
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mysql://newsai:newsai@127.0.0.1:3306/newsai_verify
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install system dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev default-mysql-client pkg-config
      - name: Grant test database privileges
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'newsai'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
      - name: Install dependencies
        run: uv pip install -r pyproject.toml --extra dev cryptography structlog
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Django check
        run: uv run python manage.py check
      - name: Migration consistency
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Migrate (MySQL 8.4)
        run: uv run python manage.py migrate
      - name: Pytest
        run: uv run pytest -q
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
