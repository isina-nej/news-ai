services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: newsai
      MYSQL_USER: newsai
      MYSQL_PASSWORD: newsai
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  rsshub:
    image: diygod/rsshub:2026-09-06
    ports: ["1200:1200"]
    environment:
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/2
      CACHE_EXPIRE: 300
      CACHE_CONTENT_EXPIRE: 3600
      ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-}
    depends_on: [redis]

  web:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: celery -A config.celery worker -l info -Q celery
    env_file: [.env]
    depends_on: [redis, mysql]

  telegram-worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    # Dedicated Telegram queue: concurrency 1 per account for sequential MTProto access.
    command: celery -A config.celery worker -l info -Q telegram -c 1
    env_file: [.env]
    depends_on: [redis, mysql]

  beat:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: [.env]
    depends_on: [redis, mysql]

volumes:
  mysql-data:
  redis-data:
