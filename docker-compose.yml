x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.docker
  DATABASE_URL: mysql://newsai:newsai@mysql:3306/newsai_validation
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  EMBEDDING_PROVIDER: fake

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: newsai
      MYSQL_USER: newsai
      MYSQL_PASSWORD: newsai
      MYSQL_ROOT_PASSWORD: root
    expose: ["3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    expose: ["6379"]
    volumes: [redis-data:/data]

  rsshub:
    image: diygod/rsshub:2026-09-06
    ports: ["1200:1200"]
    environment:
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/2
      CACHE_EXPIRE: 300
      CACHE_CONTENT_EXPIRE: 3600
      ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-}
    depends_on: [redis]

  web:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    environment: *app-environment
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
      qdrant: {condition: service_started}

  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: celery -A config.celery worker -l info -Q celery
    env_file: [.env]
    environment: *app-environment
    restart: unless-stopped
    volumes: ["fastembed-cache:/root/.cache/fastembed"]
    depends_on: [redis, mysql]

  intelligence-worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    # Phase 4: embedding + clustering queue (CPU batch inference, keep separate).
    command: celery -A config.celery worker -l info -Q intelligence -c 2 --prefetch-multiplier 1
    env_file: [.env]
    environment: *app-environment
    restart: unless-stopped
    volumes: ["fastembed-cache:/root/.cache/fastembed"]
    depends_on: [redis, mysql, qdrant]

  qdrant:
    # No container healthcheck: qdrant/qdrant images ship without wget/curl,
    # so an in-image HTTP probe always reports unhealthy. Dependents use
    # depends_on service_started plus application startup retries instead.
    image: qdrant/qdrant:v1.19.1
    expose: ["6333"]
    volumes: [qdrant-data:/qdrant/storage]

  telegram-worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    # Dedicated Telegram queue: concurrency 1 per account for sequential MTProto access.
    command: celery -A config.celery worker -l info -Q telegram -c 1
    env_file: [.env]
    environment: *app-environment
    restart: unless-stopped
    depends_on: [redis, mysql]

  beat:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: [.env]
    environment: *app-environment
    restart: unless-stopped
    depends_on: [redis, mysql]

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  fastembed-cache:
